[project]
name = "mailbox-mgmt"
version = "0.1.0"
description = "메일함 정리 프로젝트 - 스팸 분류 모델 학습 및 IMAP 자동 정리"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow>=2.13,<2.16",
    "keras-tuner>=1.4",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24,<2.0",
    "matplotlib>=3.7",
    # PyPI의 공식 `fasttext` 패키지는 Windows에서 빌드가 자주 실패함.
    # 안 되면 `pip install fasttext-wheel` (import는 여전히 `import fasttext`).
    "fasttext>=0.9.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# notebooks/는 아카이브용 원본 노트북 - 린트 대상 아님.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
